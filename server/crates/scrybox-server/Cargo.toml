[package]
name = "scrybox-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha1.workspace = true
sha2.workspace = true
base64.workspace = true
flate2.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
libc.workspace = true
icu_collator.workspace = true
icu_locale.workspace = true
regex.workspace = true
ort.workspace = true
image.workspace = true
getrandom = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "rustls-native-certs"] }
# Lane B unit 5c: TLS :3443 twin (backend/src/utils/tls.js). ring provider
# shared with hyper-rustls; rcgen mints the Node-shaped self-signed cert
# (CN scrybox, 397 d, EC P-256, KU digitalSignature+keyEncipherment, EKU
# serverAuth, SAN localhost/127.0.0.1/::1 + host addrs); x509-parser only
# reads notAfter for the reuse-or-regenerate decision; if-addrs enumerates
# the non-internal interfaces Node's os.networkInterfaces() loop feeds SAN.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
x509-parser = { version = "0.16", default-features = false }
if-addrs = "0.13"
# rcgen takes not_before/not_after as time::OffsetDateTime but does not
# re-export the crate (0.13.2).
time = "0.3"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
# body_limits.rs: lazy counting request stream (REVIEW-auth H1 proofs).
futures-util = "0.3"
http-body = "1"

# Memory queue item 5 (review/MEMORY.md #5): opt-in jemalloc global
# allocator — the measured best settle config (LD_PRELOAD study:
# narenas:2 + dirty_decay 1 s + muzzy 0 beat glibc arena2 on both HWM and
# speed). OFF by default: the lane binary keeps glibc + the iter-#4 mallopt
# tuning until the A/B verdict lands (PROGRESS-B iter-44). Build with
# `--features jemalloc`; tikv-jemallocator's default features include
# background_threads_runtime_support so decay purging does not wait on an
# allocation event.
[features]
default = []
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys"]

[dependencies.tikv-jemallocator]
version = "0.7"
optional = true

# mallctl for the boot-time narenas/decay writes (the crate keeps its raw
# bindings in a private module, so depend on -sys directly — same version
# the allocator pulls, one compiled jemalloc).
[dependencies.tikv-jemalloc-sys]
version = "0.7"
optional = true
