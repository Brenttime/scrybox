[workspace]
resolver = "2"
members = ["crates/scrybox-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
bytes = "1"
form_urlencoded = "1"
libc = "0.2"
# decks_reads: Node's `String.prototype.localeCompare` runs on full-icu
# (CLDR root). Verified 0-diff against the container's Node 22.23.4/ICU 78.3
# on the full 25,323-name card_cache corpus and 22,280 pairwise probes
# (ASCII printable, Latin accents, CJK, emoji); see PROGRESS.md iter-29.
icu_collator = { version = "2.4", features = ["compiled_data"] }
icu_locale = "2"
# rules.rs (iter-36): the CR/keyword parsers are literal ports of six JS
# regexes incl. lazy quantifiers and counted classes — hand-rolling a
# leftmost-first simulator for those was the one place a scan twin would
# have been more dangerous than the engine. regex-automata/regex-syntax are
# already in Cargo.lock (tracing-subscriber); this only adds the facade.
regex = "1"
# Lane B unit 6b (iter 3): cvScan.js twin. ort runs the SAME ONNX Runtime
# dylib the container's onnxruntime-node loads (ORT_DYLIB_PATH +
# load-dynamic) with intra=inter=1 — embeddings are bit-identical to Node.
# image is the sharp/libvips twin (decode, lanczos3 resize, jpeg encode).
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Server crate must unwind, not abort (plan section 9: a panic in one request
# must not take the whole front door down).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Fast iteration build (parity/e2e loops and the lane's live instance —
# restart-rust-b.sh builds --profile iter). Mirrors lane A's wt/server
# profile; real `release` stays for final benches and the Docker image only.
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = 0
