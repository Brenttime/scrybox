<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#121417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scrybox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Scrybox</title>
    <!-- Apply saved theme before first paint so there's no flash of the wrong theme. -->
    <script>
      (function () {
        try {
          // ManaBox is the only theme now; drop any stale saved choice.
          document.documentElement.setAttribute('data-theme', 'manabox');
          localStorage.removeItem('theme');
        } catch (e) { /* storage blocked: attribute already set */ }
      })();
    </script>
    <!-- No web fonts: the ManaBox theme (the only theme) sets --font-main to the
         system UI stack, so the Google Fonts sheet was render-blocking and unused. -->
    <!-- Card art comes from Scryfall's CDN. CardImage requests it in CORS mode
         (crossOrigin="anonymous"), so the warm connection must be a crossorigin
         one to be reused; dns-prefetch covers browsers without preconnect. -->
    <link rel="preconnect" href="https://cards.scryfall.io" crossorigin>
    <link rel="dns-prefetch" href="https://cards.scryfall.io">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
