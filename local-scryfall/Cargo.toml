[package]
name = "scryfall-api"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
axum = "0.8.9"
flate2 = "1.1.10"
memchr = "2.8.3"
rayon = "1.12.0"
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-br"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
